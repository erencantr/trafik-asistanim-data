name: Aylık Köprü ve Otoyol Tarife Güncelleyici

on:
  schedule:
    # Her ayın 1'inde saat 06:00 UTC (Türkiye saati 09:00) otomatik çalışır
    - cron: '0 6 1 * *'
  workflow_dispatch: # GitHub Actions sekmesinden istediğin an tek tuşla manuel çalıştırmanı sağlar

permissions:
  contents: write

jobs:
  update-tolls:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tarifeleri kontrol et ve güncelle
        run: node update_tolls.js

      - name: Değişiklik varsa tolls.json dosyasını commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tolls.json
          git diff --staged --quiet || (git commit -m "chore: güncel köprü ve otoyol tarifeleri yenilendi" && git push)
