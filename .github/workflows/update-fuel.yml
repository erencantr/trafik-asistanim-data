name: Gunluk Akaryakit Fiyatlari

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guncel Fiyatlari Cek ve Kaydet
        run: |
          node -e '
            const fs = require("fs");

            async function run() {
              let gasoline = 0;
              let diesel = 0;
              let lpg = 0;

              // 1. Benzin ve Motorin (Opet Istanbul Anadolu - Il Kodu: 34)
              try {
                const opetRes = await fetch("https://api.opet.com.tr/api/fuelprices/prices?ProvinceCode=34&IncludeAllProducts=true");
                const opetList = await opetRes.json();
                const items = Array.isArray(opetList) ? opetList[0]?.prices || [] : [];
                const findOpet = (kw) => {
                  const found = items.find(p => (p.productName || "").toLowerCase().includes(kw));
                  return found ? Number(found.amount) : 0;
                };
                gasoline = findOpet("kurşunsuz") || findOpet("benzin");
                diesel = findOpet("motorin");
              } catch (e) {
                console.warn("Opet hatasi:", e.message);
              }

              // 2. LPG / Otogaz (Aygaz Istanbul Anadolu)
              try {
                const aygazRes = await fetch("https://www.aygaz.com.tr/otogaz-fiyatlari", {
                  headers: { "User-Agent": "Mozilla/5.0" }
                });
                const html = await aygazRes.text();
                const istBlock = html.match(/İSTANBUL[\s\S]{0,600}?([3-5][0-9][.,][0-9]{2})/i);
                if (istBlock) {
                  lpg = Number(istBlock[1].replace(",", "."));
                }
              } catch (e) {
                console.warn("Aygaz hatasi:", e.message);
              }

              // Aygaz HTML degisirse bile benzinin ~%54 oraninda gercekci baz fiyat hesapla
              const fallbackLpg = gasoline ? Number((gasoline * 0.54).toFixed(2)) : 36.80;

              const data = {
                updatedAt: new Date().toISOString().slice(0, 10),
                currency: "TRY",
                source: "Opet & Aygaz Istanbul",
                prices: {
                  gasoline: gasoline || 68.16,
                  diesel: diesel || 88.65,
                  lpg: lpg || fallbackLpg,
                  electric: 9.45
                }
              };

              fs.writeFileSync("fuel-prices.json", JSON.stringify(data, null, 2));
              console.log("Guncellendi:", data);
            }

            run().catch(err => {
              console.error(err);
              process.exit(1);
            });
          '

      - name: JSON Dosyasini Repoya Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fuel-prices.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: gunluk akaryakit fiyatlari" && git push)
